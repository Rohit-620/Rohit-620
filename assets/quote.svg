<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a12" />
      <stop offset="50%" stop-color="#180e1a" />
      <stop offset="100%" stop-color="#0a080e" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>

    <filter id="glowQuote" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .quote-mark {
      font-family: Georgia, serif;
      font-size: 70px;
      font-weight: bold;
      fill: #ef4444;
      opacity: 0.3;
    }
    .quote-text {
      font-family: 'Segoe UI', -apple-system, Roboto, sans-serif;
      font-style: italic;
      font-weight: 500;
      font-size: 19px;
      fill: url(#textGrad);
      letter-spacing: 0.4px;
    }
    .author-text {
      font-family: 'Fira Code', Consolas, monospace;
      font-weight: 600;
      font-size: 14px;
      fill: #ef4444;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="130" rx="12" fill="url(#quoteBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle glow accents -->
  <circle cx="450" cy="65" r="70" fill="#ef4444" opacity="0.06" filter="url(#glowQuote)" />

  <!-- Quote Graphic Elements -->
  <text x="35" y="65" class="quote-mark">“</text>
  <text x="840" y="110" class="quote-mark">”</text>

  <!-- Text Content -->
  <g transform="translate(450, 52)">
    <text x="0" y="0" text-anchor="middle" class="quote-text">
      "Talk is cheap. Show me the code."
    </text>
    <text x="0" y="32" text-anchor="middle" class="author-text">
      — LINUS TORVALDS
    </text>
  </g>
</svg>
