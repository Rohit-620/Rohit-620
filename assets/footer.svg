<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="100%" stop-color="#140c18" />
    </linearGradient>

    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .footer-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 14px;
      fill: #94a3b8;
      letter-spacing: 1px;
    }
    .heart {
      fill: #ef4444;
      animation: beat 1.5s ease infinite;
      transform-origin: center;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>

  <!-- Top Divider Line -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke="url(#footerLineGrad)" stroke-width="2" />

  <!-- Content -->
  <g transform="translate(600, 75)">
    <text x="0" y="0" text-anchor="middle" class="footer-text">
      Crafted with <tspan class="heart" fill="#ef4444">❤️</tspan> &amp; Code • Thanks for visiting!
    </text>
    <text x="0" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">
      ⭐️ Don't forget to leave a star on repositories you like!
    </text>
  </g>
</svg>
