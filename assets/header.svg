<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="50%" stop-color="#120c18" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444">
        <animate attributeName="stop-color" values="#ef4444;#dc2626;#f87171;#ef4444" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#b91c1c">
        <animate attributeName="stop-color" values="#b91c1c;#ef4444;#dc2626;#b91c1c" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmer Effect -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      <animate attributeName="x1" from="-100%" to="100%" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="3.5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
      <circle cx="30" cy="0" r="1.5" fill="#ef4444" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-weight: 500;
      font-size: 20px;
      fill: #f87171;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
    }
    .floating-shape {
      animation: float 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Spheres -->
  <circle cx="150" cy="80" r="120" fill="#ef4444" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="240" r="140" fill="#dc2626" opacity="0.12" filter="url(#glow)" />

  <!-- Decorative Circuit / Tech Lines -->
  <path d="M 0 160 Q 300 200 600 120 T 1200 180" fill="none" stroke="url(#crimsonGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  <path d="M 0 200 Q 400 100 800 220 T 1200 140" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="6,6" stroke-opacity="0.3" />

  <!-- Outer Border with Glow -->
  <rect x="2" y="2" width="1196" height="316" rx="15" fill="none" stroke="url(#crimsonGrad)" stroke-width="2" stroke-opacity="0.8" />
  <rect x="2" y="2" width="1196" height="316" rx="15" fill="none" stroke="url(#shimmer)" stroke-width="2" />

  <!-- Left Cyber Emblem / Visual Anchor -->
  <g transform="translate(100, 160)" class="floating-shape">
    <circle cx="0" cy="0" r="54" fill="#15101a" stroke="url(#crimsonGrad)" stroke-width="2" filter="url(#glow)" />
    <circle cx="0" cy="0" r="44" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="8 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite" />
    </circle>
    <!-- Code Icon -->
    <path d="M -16 -12 L -28 0 L -16 12 M 16 -12 L 28 0 L 16 12 M 6 -18 L -6 18" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Central Content -->
  <g transform="translate(200, 0)">
    <!-- Top Micro Tag -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="165" height="26" rx="13" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" class="badge-text" fill="#ef4444" font-size="11" letter-spacing="1">AVAILABLE FOR HIRE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title">
      WELCOME TO MY SPACE <tspan fill="url(#crimsonGrad)">⚡</tspan>
    </text>

    <!-- Subtitle with Typing Indicator -->
    <text x="0" y="185" class="subtitle">
      FULL-STACK DEVELOPER &amp; TECH INNOVATOR
    </text>

    <!-- Description pills / mini highlights -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#18131e" stroke="#332230" stroke-width="1" />
      <text x="16" y="20" class="badge-text" fill="#e2e8f0">🚀 Full-Stack</text>

      <rect x="142" y="0" width="165" height="32" rx="8" fill="#18131e" stroke="#332230" stroke-width="1" />
      <text x="158" y="20" class="badge-text" fill="#e2e8f0">🤖 AI &amp; Machine Learning</text>

      <rect x="319" y="0" width="135" height="32" rx="8" fill="#18131e" stroke="#332230" stroke-width="1" />
      <text x="335" y="20" class="badge-text" fill="#e2e8f0">🌐 Cloud &amp; IoT</text>

      <rect x="466" y="0" width="155" height="32" rx="8" fill="#18131e" stroke="#332230" stroke-width="1" />
      <text x="482" y="20" class="badge-text" fill="#e2e8f0">⚡ Problem Solving</text>
    </g>
  </g>

  <!-- Right Decorative Elements -->
  <g transform="translate(1080, 160)" class="floating-shape" style="animation-delay: -2.5s;">
    <polygon points="0,-40 35,20 -35,20" fill="none" stroke="url(#crimsonGrad)" stroke-width="2" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="25s" repeatCount="indefinite" />
    </polygon>
  </g>
</svg>
